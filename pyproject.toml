[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-site-caretaker"
version = "0.1.0"
description = "CLI-first AI website/server caretaker for small businesses and agencies"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Dixit Chauhan", email = "chauhandixit04@gmail.com" }
]
keywords = ["monitoring", "website", "ssl", "diagnostics", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License"
]

[project.scripts]
ai-site-caretaker = "src.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
